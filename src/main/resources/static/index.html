<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Modern bank management dashboard" />
  <title>NovaBank — Management Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div>
          <div class="brand-name">NovaBank</div>
          <div class="brand-sub">Management Suite</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-route="dashboard"><span class="nav-icon">⌂</span> Dashboard</button>
        <button class="nav-item" data-route="accounts"><span class="nav-icon">◉</span> Accounts</button>
        <button class="nav-item" data-route="banks"><span class="nav-icon">▣</span> Banks & Branches</button>
        <button class="nav-item" data-route="transactions"><span class="nav-icon">↔</span> Transactions</button>
        <button class="nav-item" data-route="addresses"><span class="nav-icon">⌖</span> Addresses</button>
      </nav>

    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu">☰</button>
        <div class="breadcrumbs"><span>NovaBank</span><b>/</b><strong id="pageTitle">Dashboard</strong></div>
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle" title="Toggle theme">◐</button>
          <div class="avatar">SV</div>
        </div>
      </header>

      <section class="content">
        <div id="app"></div>
      </section>
    </main>
  </div>

  <div class="toast-stack" id="toastStack"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
